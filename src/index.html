<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XIAO Rust Camera</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101318; }
      main { width: min(94vw, 720px); text-align: center; }
      h1 { font-size: 1.35rem; font-weight: 650; }
      img { width: 100%; border-radius: 14px; background: #000; box-shadow: 0 12px 40px #0008; }
      p { color: #aeb8c7; }
    </style>
  </head>
  <body>
    <main>
      <h1>XIAO ESP32-S3 Sense · Rust</h1>
      <img id="camera" alt="Camera image">
      <p id="status">Connecting to the camera…</p>
    </main>
    <script>
      const camera = document.querySelector("#camera");
      const status = document.querySelector("#status");
      let frames = 0;

      function nextFrame() {
        camera.src = `/capture?t=${Date.now()}`;
      }

      camera.addEventListener("load", () => {
        frames += 1;
        status.textContent = `Camera online · frame ${frames}`;
        setTimeout(nextFrame, 350);
      });

      camera.addEventListener("error", () => {
        status.textContent = "Retrying camera…";
        setTimeout(nextFrame, 1000);
      });

      nextFrame();
    </script>
  </body>
</html>
